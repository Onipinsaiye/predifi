[package]
name = "predifi-client"
version = "0.1.0"
edition = "2021"
description = "Read-only asynchronous Rust client for the PrediFi API"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
