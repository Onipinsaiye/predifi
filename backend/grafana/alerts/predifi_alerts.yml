# PrediFi production alert rules (Prometheus).
#
# Every rule MUST carry:
#   labels:      severity (critical|warning), owner (see docs/runbooks/README.md), service
#   annotations: summary, description, impact, runbook_url, dashboard_url
#
# runbook_url must point at an existing heading under docs/runbooks/. This is
# enforced in CI by .github/scripts/validate_alert_runbooks.py — an alert that
# has no owner or no runbook fails the build.
#
# SLO burn-rate alerts live next to this file in predifi_slo_rules.yml.
groups:
  - name: predifi_production_alerts
    rules:
      # ── 1. API Error Rate (5xx > 1% over 5m) ───────────────────────────────
      - alert: HighApiErrorRate
        expr: (sum(rate(app_http_requests_total{status=~"5.."}[5m])) / sum(rate(app_http_requests_total[5m]))) * 100 > 1
        for: 2m
        labels:
          severity: critical
          owner: backend-oncall
          service: api
        annotations:
          summary: "API HTTP 5xx error rate exceeded 1%"
          description: "API HTTP 5xx error rate is currently {{ $value | printf \"%.2f\" }}% over the last 5 minutes."
          impact: "Users see failed page loads, missing pool data, and cannot view or claim payouts."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/api.md#highapierrorrate"
          dashboard_url: "/d/predifi-backend-prod"

      # ── 2. Request Latency (p99 > 500ms over 5m) ───────────────────────────
      - alert: HighP99Latency
        expr: histogram_quantile(0.99, sum(rate(app_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
          owner: backend-oncall
          service: api
        annotations:
          summary: "API p99 latency is greater than 500ms"
          description: "The 99th percentile HTTP request latency is {{ $value | printf \"%.3f\" }}s."
          impact: "Pages and odds load slowly; users may act on stale pool totals."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/api.md#highp99latency"
          dashboard_url: "/d/predifi-backend-prod"

      # ── 3. Worker Queue Depth & DLQ Accumulation ────────────────────────────
      - alert: WorkerQueueBacklog
        expr: app_worker_queue_depth > 50
        for: 3m
        labels:
          severity: warning
          owner: backend-oncall
          service: indexer
        annotations:
          summary: "Worker queue depth exceeded 50 jobs"
          description: "Worker queue backlog is currently {{ $value }} jobs, indicating worker lag or processing delays."
          impact: "New on-chain pools, stakes, and resolutions appear late in the app."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/worker.md#workerqueuebacklog"
          dashboard_url: "/d/predifi-backend-prod"

      - alert: WorkerDLQBacklog
        expr: app_worker_dlq_depth > 10
        for: 2m
        labels:
          severity: critical
          owner: backend-oncall
          service: indexer
        annotations:
          summary: "Worker dead-letter queue (DLQ) backlog exceeded 10 jobs"
          description: "Worker DLQ contains {{ $value }} failed jobs that exhausted retries and require operator intervention."
          impact: "Some on-chain events were not indexed; affected pools or predictions show wrong or missing data until replayed."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/worker.md#workerdlqbacklog"
          dashboard_url: "/d/predifi-backend-prod"

      # ── 4. Database Connection Saturation ───────────────────────────────────
      - alert: DatabaseConnectionPoolSaturated
        expr: db_pool_utilization_ratio > 0.8
        for: 2m
        labels:
          severity: warning
          owner: backend-oncall
          service: database
        annotations:
          summary: "Database connection pool utilization exceeded 80%"
          description: "Database connection pool utilization is currently {{ $value | humanizePercentage }} (checked out / total slots)."
          impact: "No user impact yet; latency rises if utilization keeps climbing."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/database.md#databaseconnectionpoolsaturated"
          dashboard_url: "/d/predifi-backend-prod"

      - alert: DatabaseConnectionPoolCritical
        expr: db_pool_utilization_ratio > 0.95
        for: 1m
        labels:
          severity: critical
          owner: backend-oncall
          service: database
        annotations:
          summary: "Database connection pool utilization near exhaustion (>95%)"
          description: "Database connection pool is at {{ $value | humanizePercentage }} utilization, risking query timeouts and failures."
          impact: "Requests wait for a connection and time out with 5xx errors."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/database.md#databaseconnectionpoolcritical"
          dashboard_url: "/d/predifi-backend-prod"

      # ── Auxiliary Reliability Alerts ────────────────────────────────────────
      - alert: DatabaseQueryFailures
        expr: sum(rate(app_db_queries_total{result="error"}[5m])) > 5
        for: 1m
        labels:
          severity: critical
          owner: backend-oncall
          service: database
        annotations:
          summary: "Database query error spike detected"
          description: "Database queries are failing at {{ $value | printf \"%.1f\" }} errors per second."
          impact: "Reads and indexer writes fail; users see errors or stale data."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/database.md#databasequeryfailures"
          dashboard_url: "/d/predifi-backend-prod"

      - alert: HighRedisErrors
        expr: sum(rate(app_redis_operations_total{result="error"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
          owner: infra-oncall
          service: cache
        annotations:
          summary: "High Redis operation error rate"
          description: "Redis operations are failing at {{ $value | printf \"%.1f\" }} errors per second."
          impact: "Cache misses push load to Postgres; rate limiting and sessions may degrade."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/cache.md#highrediserrors"
          dashboard_url: "/d/predifi-backend-prod"

      - alert: ContractInteractionFailures
        expr: sum(rate(app_db_queries_total{query_type=~".*contract.*",result="error"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          owner: contract-oncall
          service: contract
        annotations:
          summary: "Smart contract interaction failure detected"
          description: "Contract operations are producing errors."
          impact: "Staking, resolution, or settlement data may not match the chain."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/contract.md#contractinteractionfailures"
          dashboard_url: "/d/predifi-backend-prod"

      - alert: BackendMemoryHigh
        expr: (app_memory_used_bytes / app_memory_total_bytes) * 100 > 90
        for: 2m
        labels:
          severity: critical
          owner: infra-oncall
          service: api
        annotations:
          summary: "Backend memory usage exceeded 90% threshold"
          description: "Backend process memory usage is at {{ $value | printf \"%.2f\" }}%, risk of Out-Of-Memory (OOM) killer."
          impact: "An OOM kill drops in-flight requests and WebSocket connections."
          runbook_url: "https://github.com/Onipinsaiye/predifi/blob/main/docs/runbooks/host.md#backendmemoryhigh"
          dashboard_url: "/d/predifi-backend-prod"
