name: Scheduled Capacity Load Test

on:
  schedule:
    - cron: '0 2 * * 0' # Run every Sunday at 2:00 AM
  workflow_dispatch:    # Allow manual triggers from the UI
  pull_request:
    paths:
      - 'backend/**'

env:
  # PostgreSQL connection limit for the load-test database.
  POSTGRES_MAX_CONNECTIONS: 100
  # Reserved connections for administration, migrations and monitoring.
  DB_ADMIN_HEADROOM: 10
  # Per-service pool sizes and maximum replica counts (inventory).
  # Format: "service:pool_size:max_replicas"
  DB_POOL_INVENTORY: |
    backend:50:1
    worker:10:2
    scheduler:5:1

permissions:
  contents: read

jobs:
  connection-budget:
    name: Check Database Connection Budget
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify connection budget across peak replicas
        env:
          PREDIFI_DB_MAX_CONNECTIONS: 50
        run: |
          set -euo pipefail
          max_conn="${POSTGRES_MAX_CONNECTIONS}"
          headroom="${DB_ADMIN_HEADROOM}"
          budget=$(( max_conn - headroom ))
          echo "PostgreSQL limit: ${max_conn}, admin headroom: ${headroom}, usable budget: ${budget}"

          total=0
          while IFS=: read -r service pool replicas; do
            [ -z "${service}" ] && continue
            service_total=$(( pool * replicas ))
            echo "  ${service}: pool=${pool} x replicas=${replicas} = ${service_total}"
            total=$(( total + service_total ))
          done <<< "${DB_POOL_INVENTORY}"

          echo "Total peak connections: ${total} (budget ${budget})"
          if [ "${total}" -gt "${budget}" ]; then
            echo "::error::Unsafe configuration: ${total} connections exceed budget of ${budget} (limit ${max_conn} - headroom ${headroom})"
            exit 1
          fi

          # Also validate the configured backend pool against the budget.
          if [ "${PREDIFI_DB_MAX_CONNECTIONS}" -gt "${budget}" ]; then
            echo "::error::PREDIFI_DB_MAX_CONNECTIONS=${PREDIFI_DB_MAX_CONNECTIONS} exceeds budget of ${budget}"
            exit 1
          fi
          echo "Connection budget check passed."

  capacity-test:
    name: Run Capacity Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: predifi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Seed Database
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/predifi_test
        run: |
          cargo build --release
          cargo run --bin predifi-seed -- --fresh
          cargo run --release --bin predifi-seed -- --seed-load --pools 500 --predictions 50000

      - name: Start Backend Server
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/predifi_test
          REDIS_URL: redis://localhost:6379
          PREDIFI_DB_MAX_CONNECTIONS: 50
          PREDIFI_PERF_BUDGETS: "config/perf-budgets.toml"
          PREDIFI_REFERENCE_LOAD: "config/reference-load.toml"
          RUST_LOG: "info,predifi=debug"
        run: |
          cargo run --release &
          sleep 5 # Wait for Axum to bind to port 3000

      - name: Exercise Peak Replica Connection Budget (staging profile)
        env:
          PREDIFI_DB_MAX_CONNECTIONS: 50
          PREDIFI_STAGING_PROFILE: "1"
        run: |
          set -euo pipefail
          max_conn="${POSTGRES_MAX_CONNECTIONS}"
          headroom="${DB_ADMIN_HEADROOM}"
          budget=$(( max_conn - headroom ))
          # Staging profile exercises peak replica counts for every service.
          staging_inventory="backend:50:2
worker:10:4
scheduler:5:2"
          total=0
          while IFS=: read -r service pool replicas; do
            [ -z "${service}" ] && continue
            service_total=$(( pool * replicas ))
            echo "  ${service}: pool=${pool} x peak replicas=${replicas} = ${service_total}"
            total=$(( total + service_total ))
          done <<< "${staging_inventory}"
          echo "Staging peak connections: ${total} (budget ${budget})"
          if [ "${total}" -gt "${budget}" ]; then
            echo "::error::Unsafe staging configuration: ${total} connections exceed budget of ${budget}"
            exit 1
          fi
          echo "Staging peak replica budget check passed."

      - name: Execute Load Test
        env:
          RUN_CAPACITY_TEST: "1"
          PERF_BUDGETS_PATH: "config/perf-budgets.toml"
          PERF_REFERENCE_LOAD_PATH: "config/reference-load.toml"
          PERF_REPORT_PATH: "capacity-test-results.txt"
        run: |
          cargo test --test load_tests -- --nocapture 2>&1 | tee capacity-test-results.txt
          cargo run --release --bin predifi-perf-report -- \
            --budgets config/perf-budgets.toml \
            --reference-load config/reference-load.toml \
            --results capacity-test-results.txt \
            --output perf-report.json \
            --fail-on-regression

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacity-test-results
          path: |
            backend/capacity-test-results.txt
            backend/perf-report.json

      - name: Comment Perf Budgets on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('backend/perf-report.json', 'utf8'));
            const lines = ['### Performance Budget Report', ''];
            for (const g of report.groups) {
              const status = g.within_budget ? '✅' : '❌';
              lines.push(`${status} **${g.name}** — p95 ${g.p95_ms}ms (budget ${g.p95_budget_ms}ms), db round-trips ${g.db_roundtrips} (budget ${g.db_roundtrips_budget})`);
            }
            if (report.regressions.length) {
              lines.push('', '**Regressions detected:**');
              for (const r of report.regressions) lines.push(`- ${r}`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });