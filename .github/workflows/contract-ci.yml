name: Contract CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"
  workflow_dispatch:

# Cancel superseded runs on the same branch; different refs run independently.
concurrency:
  group: contract-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #137 — required for Sigstore-attested WASM artifacts.
# `id-token: write` lets the workflow request a short-lived OIDC token to
# sign the artifact; `attestations: write` lets it publish the attestation.
permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  WASM_SIZE_THRESHOLD_KB: 200
  BATCH_CLAIM_BENCH_BUDGET_MS: 30000

jobs:
  check:
    name: contract / cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-
      - name: cargo check
        run: cargo check --workspace --target wasm32-unknown-unknown

  fmt:
    name: contract / cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: contract / cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-clippy-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-clippy-
      - name: cargo clippy
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings

  test:
    name: contract / cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          enableCrossOsArchive: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-test-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-test-
      - name: cargo test
        run: cargo test --workspace

  test-fuzz:
    name: contract / cargo test (fuzz, bounded)
    runs-on: ubuntu-latest
    # Bounded fuzz budget: PROPTEST_CASES=256 at ~8ms/case ≈ 2s per test × 12
    # tests ≈ 30s wallclock + cargo build ≈ 3-5min. 10-minute ceiling leaves
    # headroom. If a contract change makes individual cases slow, this job
    # must NOT silently time out — it should fail visibly.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          enableCrossOsArchive: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-fuzz-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-fuzz-
      - name: cargo test (price_feed_proptests, bounded)
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p predifi-contract --lib price_feed_proptests

  # Issue: bound batch-claim execution by measured resource cost.
  # Runs the batch-claim cost benchmarks with a stable, generous budget so
  # regressions in per-claim CPU/memory cost fail visibly instead of silently
  # timing out. The benchmark also asserts the maximum supported batch size
  # and atomic behavior when any claim fails.
  batch-claim-bench:
    name: batch-claim cost benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          enableCrossOsArchive: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-bench-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-bench-
      - name: Run batch-claim cost benchmarks
        env:
          BATCH_CLAIM_BENCH_BUDGET_MS: ${{ env.BATCH_CLAIM_BENCH_BUDGET_MS }}
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          cargo test -p predifi-contract --lib batch_claim_benchmarks \
            -- --nocapture --test-threads=1
          END=$(date +%s%3N)
          ELAPSED=$(( END - START ))
          echo "batch-claim benchmarks completed in ${ELAPSED} ms (budget ${BATCH_CLAIM_BENCH_BUDGET_MS} ms)"
          if [[ "$ELAPSED" -gt "$BATCH_CLAIM_BENCH_BUDGET_MS" ]]; then
            echo "::error::batch-claim benchmarks exceeded ${BATCH_CLAIM_BENCH_BUDGET_MS} ms budget"
            exit 1
          fi

  wasm-build:
    name: contract / WASM build verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-opt (binaryen)
        run: |
          BINARYEN_VERSION="120"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-wasm-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-wasm-
      - name: Build release WASM
        run: cargo build --workspace --target wasm32-unknown-unknown --release
      - name: Optimize and verify WASM
        run: |
          WASM_DIR="target/wasm32-unknown-unknown/release"
          for CONTRACT in predifi_contract access_control; do
            RAW="${WASM_DIR}/${CONTRACT}.wasm"
            [[ -f "$RAW" ]] || continue
            OPT="${WASM_DIR}/${CONTRACT}-optimized.wasm"
            wasm-opt -O3 --strip-debug --enable-bulk-memory --enable-sign-ext -o "$OPT" "$RAW"
            BYTES=$(wc -c < "$OPT")
            KB=$(( BYTES / 1024 ))
            echo "${CONTRACT}: ${KB} KB (${BYTES} bytes)"
            if [[ "$KB" -gt "$WASM_SIZE_THRESHOLD_KB" ]]; then
              echo "::error::${CONTRACT} WASM exceeds ${WASM_SIZE_THRESHOLD_KB} KB threshold"
              exit 1
            fi
          done
      - name: Record artifact provenance
        run: |
          WASM_DIR="contract/target/wasm32-unknown-unknown/release"
          PROVENANCE="${WASM_DIR}/provenance.json"
          {
            echo "{"
            echo "  \"commit\": \"${GITHUB_SHA}\","
            echo "  \"ref\": \"${GITHUB_REF}\","
            echo "  \"run_id\": \"${GITHUB_RUN_ID}\","
            echo "  \"workflow\": \"${GITHUB_WORKFLOW}\","
            echo "  \"artifacts\": {"
            FIRST=1
            for CONTRACT in predifi_contract access_control; do
              OPT="${WASM_DIR}/${CONTRACT}-optimized.wasm"
              [[ -f "$OPT" ]] || continue
              SHA=$(sha256sum "$OPT" | awk '{print $1}')
              [[ "$FIRST" -eq 0 ]] && echo ","
              printf '    "%s": {"sha256": "%s", "bytes": %s}' "$CONTRACT" "$SHA" "$(wc -c < "$OPT")"
              FIRST=0
            done
            echo ""
            echo "  }"
            echo "}"
          } > "$PROVENANCE"
          cat "$PROVENANCE"

      - name: Attest WASM build provenance (Sigstore)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            contract/target/wasm32-unknown-unknown/release/predifi_contract-optimized.wasm
            contract/target/wasm32-unknown-unknown/release/access_control-optimized.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-${{ github.sha }}
          path: |
            contract/target/wasm32-unknown-unknown/release/predifi_contract.wasm
            contract/target/wasm32-unknown-unknown/release/predifi_contract-optimized.wasm
            contract/target/wasm32-unknown-unknown/release/access_control.wasm
            contract/target/wasm32-unknown-unknown/release/access_control-optimized.wasm
            contract/target/wasm32-unknown-unknown/release/provenance.json
          if-no-files-found: warn
          retention-days: 14

  wasm-parity:
    name: Native vs optimized WASM parity
    needs: [wasm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-wasm-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-wasm-
      - name: Download optimized WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm-${{ github.sha }}
          path: contract/target/wasm32-unknown-unknown/release
      - name: Verify artifact provenance matches source commit
        run: |
          PROVENANCE="target/wasm32-unknown-unknown/release/provenance.json"
          if [[ ! -f "$PROVENANCE" ]]; then
            echo "::error::provenance.json missing from WASM artifact bundle"
            exit 1
          fi
          ARTIFACT_COMMIT=$(python3 -c "import json,sys; print(json.load(open('$PROVENANCE'))['commit'])")
          if [[ "$ARTIFACT_COMMIT" != "${GITHUB_SHA}" ]]; then
            echo "::error::WASM artifact commit ${ARTIFACT_COMMIT} does not match source commit ${GITHUB_SHA}"
            exit 1
          fi
          echo "WASM artifacts traceable to commit ${ARTIFACT_COMMIT}"
      - name: Run native vs WASM parity suite
        env:
          PREDIFI_WASM_PATH: target/wasm32-unknown-unknown/release/predifi_contract-optimized.wasm
        run: |
          if [[ ! -f "${PREDIFI_WASM_PATH}" ]]; then
            echo "::error::optimized WASM artifact not found at ${PREDIFI_WASM_PATH}"
            exit 1
          fi
          cargo test --workspace --test wasm_parity -- --nocapture

  deploy-testnet:
    name: Deploy to testnet (verified)
    needs: [check, fmt, clippy, test, batch-claim-bench, wasm-build, wasm-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./contract
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      # ── Issue #137: download the SAME artifact that wasm-build signed ──
      - name: Download attested WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm-${{ github.sha }}
          path: contract/target/wasm32-unknown-unknown/release

      # ── Issue #137: verify signature + source revision BEFORE deploying ──
      - name: Verify WASM attestation (fail closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for WASM in \
            target/wasm32-unknown-unknown/release/predifi_contract-optimized.wasm \
            target/wasm32-unknown-unknown/release/access_control-optimized.wasm; do
            echo "Verifying ${WASM}..."
            gh attestation verify "${WASM}" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/contract-ci.yml" \
              --source-digest "${{ github.sha }}" \
              --source-ref "refs/heads/develop"
          done
          echo "::notice::All WASM artifacts verified against ${{ github.sha }}"

      # ── Issue #137: record the verified digest for audit ──
      - name: Record verified digests
        run: |
          set -euo pipefail
          for WASM in \
            target/wasm32-unknown-unknown/release/predifi_contract-optimized.wasm \
            target/wasm32-unknown-unknown/release/access_control-optimized.wasm; do
            DIGEST=$(sha256sum "${WASM}" | awk '{print $1}')
            echo "::notice::Verified ${WASM} sha256:${DIGEST}"
            echo "| ${WASM} | sha256:${DIGEST} |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt
      - name: Install wasm-opt
        run: |
          BINARYEN_VERSION="120"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
      - name: Configure testnet identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: |
          if [[ -z "${STELLAR_SECRET_KEY}" ]]; then
            echo "::error::STELLAR_TESTNET_SECRET_KEY secret is not set"
            exit 1
          fi
          printf '%s\n' "${STELLAR_SECRET_KEY}" | stellar keys add ci-deploy --secret-key
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org:443 \
            --network-passphrase "Test SDF Network ; September 2015" || true
      # ── Deploy the verified WASM (does NOT rebuild — deploys what was signed) ──
      - name: Deploy verified WASM to testnet
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh testnet ci-deploy
        env:
          STELLAR_NETWORK: testnet

  # ── Issue #137: staging tampered-artifact verification test ──
  attestation-test:
    name: contract / Attestation fail-closed test
    needs: [wasm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download signed WASM
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm-${{ github.sha }}
          path: wasm

      - name: Verify untouched artifact PASSES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify wasm/predifi_contract-optimized.wasm \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/contract-ci.yml" \
            --source-digest "${{ github.sha }}"
          echo "Untampered artifact verified."

      - name: Verify TAMPERED artifact FAILS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp wasm/predifi_contract-optimized.wasm wasm/tampered.wasm
          printf '\x00' >> wasm/tampered.wasm
          if gh attestation verify wasm/tampered.wasm \
               --repo "${{ github.repository }}" \
               --signer-workflow "${{ github.repository }}/.github/workflows/contract-ci.yml" \
               --source-digest "${{ github.sha }}" 2>/dev/null; then
            echo "::error::Tampered artifact PASSED verification — fail-closed is broken!"
            exit 1
          fi
          echo "Tampered artifact correctly REJECTED."