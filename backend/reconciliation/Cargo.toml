[workspace]

[package]
name = "predifi-reconciliation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "derive"] }
stellar-strkey = "0.0.13"
stellar-xdr = { version = "=23.0.0", features = ["base64"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.7.9"

[profile.dev]
debug = 0

[profile.test]
debug = 0
