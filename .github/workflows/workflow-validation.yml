name: Workflow Validation Matrix

# Guards the guardrails: evaluates the path filters and branch conditions in
# the component workflows against .github/ci/workflow-matrix.json. Runs when
# the trigger configuration or any shared boundary can change, never for
# docs-only edits.
on:
  push:
    branches: [main, develop, contract, frontend]
    paths:
      - ".github/workflows/**"
      - ".github/ci/**"
      - ".github/scripts/**"
      - "contract/**"
      - "backend/openapi.json"
      - "backend/src/openapi.rs"
      - "backend/src/bin/openapi_export.rs"
      - "docker-compose.yml"
      - "rustfmt.toml"
  pull_request:
    branches: [main, develop, contract, frontend]
    paths:
      - ".github/workflows/**"
      - ".github/ci/**"
      - ".github/scripts/**"
      - "contract/**"
      - "backend/openapi.json"
      - "backend/src/openapi.rs"
      - "backend/src/bin/openapi_export.rs"
      - "docker-compose.yml"
      - "rustfmt.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate triggers (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One job per integration branch: the evaluator asserts that both the
      # push and pull_request filters admit the branch and that every fixture
      # lands on the same set of workflows.
      matrix:
        branch: [main, develop, contract, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Evaluate path filters and branch conditions
        run: >-
          python .github/scripts/validate_workflow_matrix.py
          --branch "${{ matrix.branch }}"
