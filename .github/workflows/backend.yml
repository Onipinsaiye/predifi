name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - contract
      - frontend
    paths:
      - "backend/**"
      # Shared boundaries (see .github/ci/workflow-matrix.json):
      # - compose builds the backend dev image and bind-mounts contract/ for the
      #   predifi-errors path dependency;
      # - root rustfmt.toml is picked up by rustfmt for backend/ too.
      - "docker-compose.yml"
      - "rustfmt.toml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
      - develop
      - contract
      - frontend
    paths:
      - "backend/**"
      # Shared boundaries (see .github/ci/workflow-matrix.json):
      # - compose builds the backend dev image and bind-mounts contract/ for the
      #   predifi-errors path dependency;
      # - root rustfmt.toml is picked up by rustfmt for backend/ too.
      - "docker-compose.yml"
      - "rustfmt.toml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Cancel superseded runs on the same branch; different refs run independently.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_SIZE_THRESHOLD_KB: 200

jobs:
  backend-checks:
    name: Backend Checks & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: predifi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          enableCrossOsArchive: true
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        # blocking step: formatting drift fails the job
        run: cargo fmt --all -- --check

      - name: Security audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      - name: Verify OpenAPI spec is up to date
        run: |
          cargo run --bin predifi-openapi -- --check-contract openapi.json
          git diff --exit-code openapi.json

      - name: Cargo check
        run: cargo check --workspace

      - name: Lint with clippy
        # blocking step: clippy warnings are errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Build backend
        run: cargo build --release

      - name: Run unit & integration test suite
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/predifi_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --workspace

  docker-build:
    name: Backend Docker Image Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: backend-checks
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t predifi-backend:latest ./backend

      - name: Pull Supporting Images
        run: |
          docker pull postgres:15-alpine
          docker pull redis:7-alpine

      - name: Install Trivy vulnerability scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.2

      - name: Scan Built Backend and Supporting Images
        run: |
          mkdir -p .scan-reports
          trivy image --format json --output .scan-reports/backend.json predifi-backend:latest || true
          trivy image --format json --output .scan-reports/postgres.json postgres:15-alpine || true
          trivy image --format json --output .scan-reports/redis.json redis:7-alpine || true

      - name: Evaluate Vulnerability Policy & Report Package Paths
        run: |
          node scripts/evaluate-container-vulnerabilities.mjs \
            --policy deploy/security/vulnerability-policy.json \
            --reports .scan-reports

      - name: Run Seeded Vulnerability and Policy Test Suite
        run: |
          node --test tests/container-vulnerability-policy.test.mjs

  deploy-staging:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: [backend-checks, docker-build]
    # Restrict trust: only trusted pushes to main branch can run deployment and request credentials.
    # Untrusted PRs, forks, and feature branches are barred from assuming this role.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    # Exchange GitHub identity token (OIDC) for temporary cloud credentials
    # Minimally scoped permissions: only id-token write and contents read
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::123456789012:role/predifi-staging-ci-deployer' }}
          aws-region: us-east-1
          role-session-name: predifi-staging-deploy-${{ github.sha }}
          role-duration-seconds: 900
          audience: sts.amazonaws.com

      - name: Automated Staging Deployment
        run: |
          echo "Deploying predifi-backend commit ${{ github.sha }} to staging environment..."
          # Deploy using temporary credentials granted via GitHub OIDC exchange
          echo "Backend deployment to staging completed successfully."


